services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-coolify}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      META_GRAPH_URL: ${META_GRAPH_URL:-https://graph.facebook.com}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-meta_webhook_verify_token_whatsapp_crm}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "${PORT:-5000}"
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
